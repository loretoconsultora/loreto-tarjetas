<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Montserrat', sans-serif;
  background: linear-gradient(160deg, #0d1b3e 0%, #1a2a5e 50%, #0a0e1f 100%);
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 40px 24px;
  gap: 32px;
}
.logo-wrap { text-align: center; }
.logo-wrap img { height: 40px; width: auto; }
h2 { font-size: 13px; letter-spacing: 3px; color: rgba(255,255,255,.45); text-transform: uppercase; font-weight: 600; margin-top: 10px; }
.team { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 360px; }
.team-btn {
  display: flex; align-items: center; gap: 16px;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
  border-radius: 16px; padding: 14px 18px; text-decoration: none;
  transition: all .25s;
}
.team-btn:hover { background: rgba(255,255,255,.12); border-color: rgba(106,138,255,.4); transform: translateY(-2px); }
.team-photo { width: 52px; height: 52px; border-radius: 14px; overflow: hidden; flex-shrink: 0; border: 2px solid rgba(106,138,255,.3); }
.team-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.team-info { flex: 1; }
.team-name { font-size: 15px; font-weight: 800; color: white; letter-spacing: -.3px; margin-bottom: 4px; }
.team-role { font-size: 9px; font-weight: 600; color: rgba(178,251,255,.7); letter-spacing: .8px; text-transform: uppercase; line-height: 1.4; }
.arrow { color: rgba(255,255,255,.3); font-size: 18px; }
.stripe { height: 4px; width: 100%; max-width: 360px; border-radius: 2px; background: linear-gradient(90deg, #5cc8c2, #f4a7c0, #f5c842, #6a8aff); }
</style>
